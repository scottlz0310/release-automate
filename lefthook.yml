# Lefthook configuration for release-automate
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,mjs,json,jsonc,md,yml,yaml}"
      run: bunx biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    workflow-needs:
      glob: ".github/workflows/*.{yml,yaml}"
      run: bun scripts/validate-workflow-needs.mjs {staged_files}

pre-push:
  parallel: true
  commands:
    bun-test:
      run: bun test
    pester:
      run: pwsh -NoProfile -Command "Invoke-Pester -Path ./tests"
