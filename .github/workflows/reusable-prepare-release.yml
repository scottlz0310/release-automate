name: Reusable Prepare Release

on:
  workflow_call:
    inputs:
      target_version:
        description: 'Release target version (e.g. 1.2.0 or v1.2.0)'
        required: true
        type: string
      bump_command:
        description: 'Optional shell command to bump version definition files (e.g. npm version ...)'
        required: false
        type: string
        default: ''
      changelog_path:
        description: 'Relative path to CHANGELOG.md'
        required: false
        type: string
        default: 'CHANGELOG.md'
      base_branch:
        description: 'Base branch to create PR against'
        required: false
        type: string
        default: 'main'
      branch_prefix:
        description: 'Prefix for release branch name'
        required: false
        type: string
        default: 'release/'
      commit_prefix:
        description: 'Prefix for commit message and PR title'
        required: false
        type: string
        default: 'chore(release):'
    secrets:
      RELEASE_BOT_APP_ID:
        description: 'GitHub App ID for bot authentication'
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        description: 'GitHub App Private Key (PEM format)'
        required: true

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Configure Git Author
        run: |
          git config user.name "${{ steps.app_token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app_token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Run Bump Command
        if: inputs.bump_command != ''
        env:
          BUMP_COMMAND: ${{ inputs.bump_command }}
        run: |
          echo "Executing version bump command..."
          eval "$BUMP_COMMAND"

      - name: Update Changelog and Parse Version
        id: prepare_meta
        env:
          RAW_VERSION: ${{ inputs.target_version }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: |
          VERSION="${RAW_VERSION#v}"
          TAG_NAME="v${VERSION}"
          TODAY=$(date +'%Y-%m-%d')

          echo "Target Version: ${VERSION}"
          echo "Tag Name: ${TAG_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          if [ -f "$CHANGELOG_PATH" ]; then
            echo "Updating $CHANGELOG_PATH..."
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            REPO_URL="https://github.com/${{ github.repository }}"

            # Replace [Unreleased] header with new version and fresh [Unreleased]
            sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n## [${VERSION}] - ${TODAY}/" "$CHANGELOG_PATH"

            # Update comparison links
            if [ -n "$PREV_TAG" ]; then
              sed -i "s|\[Unreleased\]: .*|\[Unreleased\]: ${REPO_URL}/compare/${TAG_NAME}...HEAD\n[${VERSION}]: ${REPO_URL}/compare/${PREV_TAG}...${TAG_NAME}|" "$CHANGELOG_PATH"
            else
              sed -i "s|\[Unreleased\]: .*|\[Unreleased\]: ${REPO_URL}/compare/${TAG_NAME}...HEAD\n[${VERSION}]: ${REPO_URL}/releases/tag/${TAG_NAME}|" "$CHANGELOG_PATH"
            fi
          else
            echo "No changelog found at $CHANGELOG_PATH. Skipping changelog update."
          fi

      - name: Create Release Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app_token.outputs.token }}
          branch: ${{ inputs.branch_prefix }}${TAG_NAME}
          base: ${{ inputs.base_branch }}
          title: "${{ inputs.commit_prefix }} ${{ steps.prepare_meta.outputs.tag_name }}"
          body: |
            ## Release ${{ steps.prepare_meta.outputs.tag_name }}

            This automated pull request prepares the release for `${{ steps.prepare_meta.outputs.version }}`.

            - **Version:** `${{ steps.prepare_meta.outputs.version }}`
            - **Tag:** `${{ steps.prepare_meta.outputs.tag_name }}`
            - Finalized `[Unreleased]` section in `${{ inputs.changelog_path }}`

            > [!NOTE]
            > Merging this PR (Squash and merge) into `${{ inputs.base_branch }}` will automatically trigger the release workflow to publish the GitHub Release and create tag `${{ steps.prepare_meta.outputs.tag_name }}`.
          commit-message: "${{ inputs.commit_prefix }} prepare ${{ steps.prepare_meta.outputs.tag_name }}"
          delete-branch: true
