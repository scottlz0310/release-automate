name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  biome:
    name: Lint & Format (Biome)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and linting
        run: bun run check

      - name: Validate workflow job dependencies
        run: bun run validate:workflows

      - name: Test workflow dependency validator
        run: bun run test:workflows

  release-workflows:
    name: Test release workflows
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run mocked release scenarios
        run: bash tests/release-workflows.sh

      - name: 多言語原稿と公開後の証跡を検証
        run: bash tests/release-adoption.sh

      - name: npm と dotnet の版の契約を検証
        run: bash tests/managed-prepare.sh

      - name: 自己リリースの CI とメジャータグ更新を検証
        run: bash tests/self-release.sh

      - name: Run Rust prepare scenarios
        run: bash tests/rust-prepare.sh

      - name: Run Tauri prepare scenarios
        run: bash tests/tauri-prepare.sh

      - name: Check scenario shell script
        run: shellcheck tests/release-workflows.sh tests/release-adoption.sh tests/managed-prepare.sh tests/rust-prepare.sh tests/tauri-prepare.sh scripts/self-release.sh tests/self-release.sh

  pester:
    name: Test key management (Pester)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester
        shell: pwsh
        run: |
          # renovate: datasource=nuget registryUrl=https://www.powershellgallery.com/api/v2 depName=Pester
          Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser

      - name: Run Pester with coverage
        shell: pwsh
        run: |
          Import-Module Pester -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = './scripts'
          $config.CodeCoverage.OutputFormat = 'JaCoCo'
          $config.CodeCoverage.OutputPath = 'coverage.xml'
          Invoke-Pester -Configuration $config

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
