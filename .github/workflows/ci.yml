name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint Workflows (actionlint)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: 限定除外が現在も必要か確認
        run: |
          # 通常 lint の uses 宣言を正本とし、digest を二重管理しない。
          image=$(awk '$1 == "uses:" && $2 ~ /^docker:\/\/rhysd\/actionlint@sha256:/ { sub(/\r$/, "", $2); sub(/^docker:\/\//, "", $2); print $2 }' .github/workflows/ci.yml)
          bash scripts/check-actionlint-workaround.sh \
            docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image"

  release-workflows:
    name: Test release workflows
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run mocked release scenarios
        run: bash tests/release-workflows.sh

      - name: Run Rust prepare scenarios
        run: bash tests/rust-prepare.sh

      - name: Run Tauri prepare scenarios
        run: bash tests/tauri-prepare.sh

      - name: 限定除外の判定シナリオを検証
        run: bash tests/actionlint-workaround.sh

      - name: Check scenario shell script
        run: shellcheck tests/release-workflows.sh tests/rust-prepare.sh tests/tauri-prepare.sh scripts/check-actionlint-workaround.sh tests/actionlint-workaround.sh

  pester:
    name: Test key management (Pester)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Pester
        shell: pwsh
        run: |
          # renovate: datasource=nuget registryUrl=https://www.powershellgallery.com/api/v2 depName=Pester
          Install-Module Pester -RequiredVersion 6.2.0 -Force -Scope CurrentUser

      - name: Run Pester with coverage
        shell: pwsh
        run: |
          Import-Module Pester -ErrorAction Stop
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = './scripts'
          $config.CodeCoverage.OutputFormat = 'JaCoCo'
          $config.CodeCoverage.OutputPath = 'coverage.xml'
          Invoke-Pester -Configuration $config

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          disable_search: true
          fail_ci_if_error: true
          use_oidc: true
